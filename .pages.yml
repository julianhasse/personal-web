settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "Publish {path} via Editorial Dashboard"
      update: "Update {path} via Editorial Dashboard"
      delete: "Remove {path} via Editorial Dashboard"
      rename: "Rename {oldPath} to {newPath} via Editorial Dashboard"

media:
  - name: images
    label: Publication images
    input: assets/images
    output: /assets/images
    rename: safe
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif, svg]

content:
  - name: editorial
    label: Editorial
    type: group
    items:
      - name: writing
        label: Articles
        type: collection
        path: content/writing
        format: yaml-frontmatter
        exclude:
          - README.md
          - _template.md
        filename:
          template: "{primary}.md"
          field: create
        view:
          primary: title
          fields: [date, draft, featured, tags]
          sort: [date, title]
          search: [title, description, tags, body]
          default:
            sort: date
            order: desc
        fields:
          - name: title
            label: Title
            type: string
            required: true
            description: The article headline. It also generates the default filename/slug.
            options:
              minlength: 3
              maxlength: 140

          - name: date
            label: Publication date
            type: date
            required: true
            options:
              format: yyyy-MM-dd

          - name: description
            label: Deck / description
            type: text
            required: true
            description: A concise summary used beneath the title and for search metadata.
            options:
              minlength: 20
              maxlength: 240

          - name: tags
            label: Topics
            type: string
            description: "Separate topics with a middle dot, comma, or vertical bar, for example: AI · Design · Publishing."

          - name: author
            label: Author
            type: string
            default: Julian Hasse

          - name: cover
            label: Cover image
            type: image
            options:
              media: images
              path: writing
              rename: safe
              extensions: [jpg, jpeg, png, webp, gif]

          - name: cover_alt
            label: Cover image description
            type: string
            description: Describe the image for readers using assistive technology.

          - name: featured
            label: Featured
            type: boolean
            default: false

          - name: draft
            label: Draft
            type: boolean
            default: true
            description: Draft articles remain in GitHub but are excluded from the public article list.

          - name: reading
            label: Reading time override
            type: string
            description: Optional. Leave blank to calculate it automatically.

          - name: body
            label: Article
            type: rich-text
            required: true
            options:
              format: markdown
              switcher: true
              media: images
              path: writing
              rename: safe
              extensions: [jpg, jpeg, png, webp, gif]

      - name: projects
        label: Projects
        type: collection
        path: content/work
        format: yaml-frontmatter
        exclude:
          - README.md
          - _work-template.md
        filename:
          template: "{primary}.md"
          field: create
        view:
          primary: title
          fields: [order, year, status, featured, draft]
          sort: [order, year, title]
          search: [title, summary, categories, role, body]
          default:
            sort: order
            order: asc
        fields:
          - name: title
            label: Project title
            type: string
            required: true

          - name: summary
            label: Summary
            type: text
            required: true
            options:
              minlength: 20
              maxlength: 300

          - name: categories
            label: Categories
            type: string
            description: Separate categories with a middle dot, comma, or vertical bar.

          - name: type
            label: Project type
            type: string

          - name: role
            label: Role
            type: string

          - name: client
            label: Client
            type: string

          - name: year
            label: Year
            type: string

          - name: duration
            label: Duration
            type: string

          - name: status
            label: Status
            type: string

          - name: order
            label: Display order
            type: number
            default: 999

          - name: featured
            label: Featured on homepage
            type: boolean
            default: true

          - name: draft
            label: Draft
            type: boolean
            default: true

          - name: cover
            label: Project cover
            type: image
            options:
              media: images
              path: projects
              rename: safe
              extensions: [jpg, jpeg, png, webp, gif]

          - name: cover_alt
            label: Cover image description
            type: string

          - name: external_url
            label: External project URL
            type: string

          - name: body
            label: Case study
            type: rich-text
            required: true
            options:
              format: markdown
              switcher: true
              media: images
              path: projects
              rename: safe
              extensions: [jpg, jpeg, png, webp, gif]
